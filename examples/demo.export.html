<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>示例界面</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", "Noto Sans SC", sans-serif;line-height:1.4}

.hd-root{position:fixed;left:0;top:0;right:0;bottom:0}
.hd-root{box-sizing:border-box}
.hd-topbar{box-sizing:border-box;background:#eef1f4;position:absolute;left:0px;width:100%;top:0px;height:56px;min-height:56px}
.hd-topbar-title{box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:hidden;white-space:nowrap;color:#202124;font-size:20px;font-weight:bold;position:absolute;left:16px;width:284px;top:14px;height:calc(100% - 28px)}
.hd-topbar-save{box-sizing:border-box;appearance:none;-webkit-appearance:none;border:1px solid #a5abb1;margin:0;font:inherit;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;background:#4a9de0;color:#ffffff;font-size:14px;border-radius:4px;padding:6px;position:absolute;right:16px;width:94px;top:12px;height:calc(100% - 24px)}
.hd-topbar-save:hover{filter:brightness(1.06)}
.hd-topbar-save:active{filter:brightness(0.92)}
.hd-sidebar{box-sizing:border-box;background:#f5f6f8;position:absolute;left:0px;width:200px;top:56px;height:calc(100% - 56px)}
.hd-sb-play{box-sizing:border-box;appearance:none;-webkit-appearance:none;border:1px solid #a5abb1;margin:0;font:inherit;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;background:#e3e6e9;color:#1a1a1a;font-size:14px;border-radius:4px;padding:6px;position:absolute;left:16px;width:168px;top:16px;height:32px}
.hd-sb-play:hover{filter:brightness(1.06)}
.hd-sb-play:active{filter:brightness(0.92)}
.hd-sb-pause{box-sizing:border-box;appearance:none;-webkit-appearance:none;border:1px solid #a5abb1;margin:0;font:inherit;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;background:#e3e6e9;color:#1a1a1a;font-size:14px;border-radius:4px;padding:6px;position:absolute;left:16px;width:168px;top:52px;height:32px}
.hd-sb-pause:hover{filter:brightness(1.06)}
.hd-sb-pause:active{filter:brightness(0.92)}
.hd-sb-loop{box-sizing:border-box;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:#202124;font-size:14px;position:absolute;left:16px;width:160px;top:96px;height:26px}
.hd-sb-loop input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid #9aa0a6;border-radius:3px;background:#fff;margin:0;display:inline-block;position:relative;flex:none}
.hd-sb-loop input[type=checkbox]:checked{background:#4a9de0;border-color:#4a9de0}
.hd-sb-loop input[type=checkbox]:checked::after{content:'';position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.hd-bottom-vbox{box-sizing:border-box;background:#ffffff;position:absolute;left:0px;width:100%;top:calc(100% - 108px);height:108px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.hd-btn-start{box-sizing:border-box;appearance:none;-webkit-appearance:none;border:1px solid #a5abb1;margin:0;font:inherit;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;background:#59b569;color:#ffffff;font-size:14px;border-radius:4px;padding:6px;flex:0 0 auto;align-self:stretch}
.hd-btn-start:hover{filter:brightness(1.06)}
.hd-btn-start:active{filter:brightness(0.92)}
.hd-btn-stop{box-sizing:border-box;appearance:none;-webkit-appearance:none;border:1px solid #a5abb1;margin:0;font:inherit;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;background:#d95555;color:#ffffff;font-size:14px;border-radius:4px;padding:6px;flex:0 0 auto;align-self:stretch}
.hd-btn-stop:hover{filter:brightness(1.06)}
.hd-btn-stop:active{filter:brightness(0.92)}
.hd-btn-quit{box-sizing:border-box;appearance:none;-webkit-appearance:none;border:1px solid #a5abb1;margin:0;font:inherit;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;background:#e3e6e9;color:#1a1a1a;font-size:14px;border-radius:4px;padding:6px;flex:0 0 auto;align-self:stretch}
.hd-btn-quit:hover{filter:brightness(1.06)}
.hd-btn-quit:active{filter:brightness(0.92)}
.hd-center-label{box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:hidden;white-space:nowrap;color:#3c4043;font-size:18px;text-align:center;position:absolute;left:calc(50% - 160px);width:320px;top:calc(50% - 20px);height:40px}
.hd-search-input{box-sizing:border-box;appearance:none;-webkit-appearance:none;margin:0;font:inherit;outline:none;background:#ffffff;color:#1a1a1a;font-size:14px;border-radius:3px;padding:4px;border:1px solid #a5abb1;position:absolute;left:calc(50% - 160px);width:320px;top:calc(50% + 28px);height:32px}
.hd-search-input:focus{border-color:#4a9de0;box-shadow:0 0 0 2px rgba(74,157,224,0.35);outline:none}
</style>
</head>
<body>
<div class="hd-root hd-root" data-hd="root">
<div class="hd-topbar" data-hd="topbar"><div class="hd-topbar-title" data-hd="topbar-title">HTML Designer</div><button type="button" class="hd-topbar-save" data-hd="topbar-save">保存</button></div><div class="hd-sidebar" data-hd="sidebar"><button type="button" class="hd-sb-play" data-hd="sb-play">播放</button><button type="button" class="hd-sb-pause" data-hd="sb-pause">暂停</button><label class="hd-sb-loop" data-hd="sb-loop"><input type="checkbox"><span>自动循环</span></label></div><div class="hd-bottom-vbox" data-hd="bottom-vbox"><button type="button" class="hd-btn-start" data-hd="btn-start">开始</button><button type="button" class="hd-btn-stop" data-hd="btn-stop">停止</button><button type="button" class="hd-btn-quit" data-hd="btn-quit">退出</button></div><div class="hd-center-label" data-hd="center-label">欢迎使用 HTML Designer</div><input type="text" class="hd-search-input" data-hd="search-input" value="" placeholder="搜索…">
</div>
<script>
// 节点变量：可直接用于后续 JS（名字 = 父__子，不含根）
const panel = document.querySelector('.hd-topbar');
const panel__label = document.querySelector('.hd-topbar-title');
const panel__button = document.querySelector('.hd-topbar-save');
const panel_2 = document.querySelector('.hd-sidebar');
const panel_2__button = document.querySelector('.hd-sb-play');
const panel_2__button_2 = document.querySelector('.hd-sb-pause');
const panel_2__checkbox = document.querySelector('.hd-sb-loop');
const vbox = document.querySelector('.hd-bottom-vbox');
const vbox__button = document.querySelector('.hd-btn-start');
const vbox__button_2 = document.querySelector('.hd-btn-stop');
const vbox__button_3 = document.querySelector('.hd-btn-quit');
const label = document.querySelector('.hd-center-label');
const lineedit = document.querySelector('.hd-search-input');
</script>
</body>
</html>
